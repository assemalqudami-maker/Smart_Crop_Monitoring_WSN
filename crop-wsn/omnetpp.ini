[General]
network = wsn.crop.FarmNetwork
sim-time-limit = 930s
seed-set = 5
result-dir = results
**.vector-recording = false
**.scalar-recording = true
**.param-recording = false

# Inet's native 802.15.4 narrowband PHY and MAC; ZigBee NWK is not present.
**.arp.typename = "GlobalArp"
*.configurator.addStaticRoutes = false
**.mobility.initFromDisplayString = false
*.sink.mobility.initialX = 10m
*.sink.mobility.initialY = 100m

# 50 m maximum communication cut-off in the radio medium.
# This is a model boundary; later tests must verify actual delivery by distance.
*.radioMedium.rangeFilter = "communicationRange"
*.radioMedium.mediumLimitCache.maxCommunicationRange = 50m
*.radioMedium.backgroundNoise.power = -110dBm

# Sensor nodes also act as relays using manually specified IPv4 routes.
*.sensor[*].forwarding = true
*.sensor[*].numApps = 1
*.sensor[*].app[0].typename = "CropTelemetryApp"
*.sensor[*].app[0].sensorId = index
*.sensor[*].app[0].baseTemperatureC = 21 + 0.35 * index
*.sensor[*].app[0].baseHumidityPct = 48 + 0.7 * index
*.sensor[*].app[0].baseSoilMoisturePct = 28 + 1.5 * index
*.sensor[*].app[0].destAddresses = "sink"
*.sensor[*].app[0].destPort = 1000
*.sensor[*].app[0].messageLength = 128B
*.sensor[*].app[0].packetName = "CropTelemetry"
*.sensor[*].app[0].sendInterval = 300s
*.sensor[*].app[0].startTime = uniform(1s, 5s)
*.sensor[*].app[0].timeToLive = 16

*.sink.numApps = 1
*.sink.app[0].typename = "CropTelemetrySink"
*.sink.app[0].localPort = 1000

# Finite 1000 J starting capacity per sensor and sink. The same starting
# energy is applied to both scenarios; energy consumed = start - residual.
*.sensor[*].energyStorage.typename = "SimpleEpEnergyStorage"
*.sink.energyStorage.typename = "SimpleEpEnergyStorage"
**.energyStorage.nominalCapacity = 1000J
**.energyStorage.initialCapacity = 1000J
**.energyStorage.residualEnergyCapacity.result-recording-modes = +last

# Record application packet counters and sink delay from simulation statistics.
**.app[*].packetSent:count.scalar-recording = true
**.app[*].packetReceived:count.scalar-recording = true
**.app[*].endToEndDelay:histogram.scalar-recording = true

# Useful when opening the scenario in Qtenv on a local computer.
*.visualizer.networkRouteVisualizer[0].displayRoutes = true
*.visualizer.dataLinkVisualizer[0].displayLinks = true

