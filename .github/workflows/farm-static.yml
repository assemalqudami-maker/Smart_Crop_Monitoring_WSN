name: Farm topology static validation

on:
  push:
    paths:
      - 'crop-wsn/**'
      - '.github/workflows/farm-static.yml'
  pull_request:
    paths:
      - 'crop-wsn/**'
      - '.github/workflows/farm-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check shell runner syntax and line continuations
        run: bash -n inet-radio/run.sh
      - name: Check 12 sensor nodes, 1 sink, loop-free next hops and 50m links
        run: python3 crop-wsn/verify_layout.py
      - name: Validate result parser against synthetic test fixtures (not measurements)
        run: python3 -m unittest discover -s crop-wsn -p 'test_*.py' -v
